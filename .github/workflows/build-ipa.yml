name: Build unsigned iOS IPA

# 用法（在自己 fork 的仓库里）：
#   1. 把补丁应用到分支并提交：
#        for p in patches/412_*.patch patches/393_*.patch; do patch -p1 < "$p"; done
#        git add -A && git commit -m "Apply fix patches (GH#412, GH#393)"
#   2. 把本文件放到 .github/workflows/build-ipa.yml 并提交
#   3. 仓库 Actions 页 → "Build unsigned iOS IPA" → Run workflow
#   4. 跑完（约 60–90 分钟，首次含原生依赖编译）在 Summary 下载 artifact
#   5. 未签名 IPA 不能直接安装：用 ESign / AltStore / Sideloadly 签名后侧载
#      （免费 Apple ID 签名有效期 7 天，付费账号 1 年）

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 150
    steps:
      - name: Checkout (with submodules)
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install toolchain
        run: |
          brew install ninja llvm libarchive pkg-config go
          brew install meson || pip3 install meson
          go version

      - name: Metal toolchain (FFmpeg videotoolbox filters)
        run: sudo xcodebuild -downloadComponent MetalToolchain || echo "metal toolchain download failed; continuing"

      # 原生依赖很贵（30–60 分钟），用 actions/cache 按 scripts 内容缓存
      - name: Cache native deps
        uses: actions/cache@v4
        with:
          path: |
            deps/lame-build
            deps/frameworks
            deps/libs
            deps/include
            deps/resources
          key: ios-native-deps-${{ hashFiles('deps/build_*.sh', 'deps/prepare_alpine_rootfs.sh') }}-${{ github.sha }}
          restore-keys: ios-native-deps-${{ hashFiles('deps/build_*.sh', 'deps/prepare_alpine_rootfs.sh') }}-

      - name: Build native dependencies
        run: |
          ./deps/build_lame.sh
          ./deps/build_ffmpeg.sh
          ./deps/build_ish.sh
          ./deps/prepare_alpine_rootfs.sh
          ./deps/build_rclone_ios.sh

      - name: Prepare xcconfig
        run: cp src/ios/Configs/ProviderCustomization.xcconfig.example src/ios/Configs/ProviderCustomization.xcconfig

      - name: xcodebuild (unsigned, device arm64)
        run: |
          xcodebuild -project src/ios/Minis.xcodeproj \
            -scheme Minis -configuration Release \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY='' \
            DEVELOPMENT_TEAM='' build

      - name: Assemble unsigned IPA
        run: |
          APP=$(find build/Build/Products/Release-iphoneos -maxdepth 1 -name '*.app' | head -1)
          test -n "$APP"
          mkdir Payload
          cp -R "$APP" Payload/
          zip -qry Minis-unsigned.ipa Payload
          ls -lh Minis-unsigned.ipa

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: Minis-unsigned-ipa
          path: Minis-unsigned.ipa
          retention-days: 14
