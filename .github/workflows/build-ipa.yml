name: Build unsigned iOS IPA

# 用法（在自己 fork 的仓库里）：
#   1. 把补丁应用到分支并提交
#   2. 本文件放到 .github/workflows/build-ipa.yml 并提交
#   3. 仓库 Actions 页 → "Build unsigned iOS IPA" → Run workflow
#   4. 跑完（约 30–60 分钟）在 Summary 下载 artifact
#   5. 未签名 IPA 不能直接安装：用 ESign / AltStore / Sideloadly 签名后侧载
#      （免费 Apple ID 签名有效期 7 天，付费账号 1 年）

on:
  workflow_dispatch:

jobs:
  build:
    # macOS 26 (arm64) — 默认 Xcode 26.6，含 iOS 26.x SDK（macos-15 默认 Xcode 16.4，太老）
    runs-on: macos-26
    timeout-minutes: 180
    steps:
      - name: Checkout (with submodules)
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Toolchain check (fast fail)
        run: |
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-version || true
          echo "── shared schemes ──"
          ls src/ios/Minis.xcodeproj/xcshareddata/xcschemes/ 2>/dev/null || echo "(no shared schemes)"

      - name: Install toolchain
        run: |
          # 注意：2026 年起 Homebrew 的 lld 是独立 formula（llvm 包不再带 ld.lld）
          brew install ninja llvm lld libarchive pkg-config go
          brew install meson || pip3 install meson

          echo "/opt/homebrew/opt/llvm/bin" >> "$GITHUB_PATH"
          echo "/opt/homebrew/opt/lld/bin" >> "$GITHUB_PATH"

          # 硬校验：ld.lld 必须存在，否则 iSH VDSO 构建必挂（之前两次就死在这）
          LLD_PATH=$(ls /opt/homebrew/opt/lld/bin/ld.lld 2>/dev/null || command -v ld.lld || true)
          if [ -z "$LLD_PATH" ]; then
            echo "::error::ld.lld not found — VDSO build would fail"
            exit 1
          fi
          echo "✓ ld.lld: $LLD_PATH"
          sudo ln -sf "$LLD_PATH" /usr/local/bin/ld.lld
          ls -la /usr/local/bin/ld.lld

          go version

      - name: Metal toolchain (FFmpeg videotoolbox filters)
        run: sudo xcodebuild -downloadComponent MetalToolchain || echo "metal toolchain skipped; continuing"

      - name: Build native dependencies
        run: |
          export PATH="/opt/homebrew/opt/llvm/bin:/opt/homebrew/opt/lld/bin:$PATH"
          ./deps/build_lame.sh
          ./deps/build_ffmpeg.sh
          ./deps/build_ish.sh
          ./deps/prepare_alpine_rootfs.sh
          ./deps/build_rclone_ios.sh

      - name: Prepare xcconfig
        run: cp src/ios/Configs/ProviderCustomization.xcconfig.example src/ios/Configs/ProviderCustomization.xcconfig

      - name: xcodebuild (unsigned, device arm64)
        run: |
          xcodebuild -project src/ios/Minis.xcodeproj \
            -scheme Minis -configuration Release \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY='' \
            DEVELOPMENT_TEAM='' \
            build

      - name: Assemble unsigned IPA
        run: |
          APP=$(find build/Build/Products/Release-iphoneos -maxdepth 1 -name '*.app' | head -1)
          test -n "$APP"
          echo "App bundle: $APP"
          du -sh "$APP" || true
          mkdir Payload
          cp -R "$APP" Payload/
          zip -qry Minis-unsigned.ipa Payload
          ls -lh Minis-unsigned.ipa

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: Minis-unsigned-ipa
          path: Minis-unsigned.ipa
          retention-days: 14
